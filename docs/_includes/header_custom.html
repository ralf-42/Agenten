<nav class="course-navigation" aria-label="Kursbereiche">
  {% for item in site.data.course_navigation %}
    {% assign current_section = false %}
    {% if page.title == item.title or page.parent == item.title or page.grand_parent == item.title %}
      {% assign current_section = true %}
    {% endif %}
    <a class="course-navigation-link{% if current_section %} is-current{% endif %}" href="{{ item.url | relative_url }}"{% if current_section %} aria-current="{% if page.title == item.title %}page{% else %}location{% endif %}"{% endif %}>{{ item.title | escape }}</a>
  {% endfor %}
  <a class="course-navigation-link course-navigation-lab" href="{{ '/visualisierungen/agent_patterns_lab/#docs' | relative_url }}" target="_blank" rel="noopener">Agent Lab öffnen ↗<span class="sr-only"> (neuer Tab)</span></a>
</nav>
