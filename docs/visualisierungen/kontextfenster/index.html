<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Kontext-Verlust Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: #666;
            font-size: 1.1em;
            max-width: 600px;
            margin: 0 auto;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #e9ecef;
        }

        .control-group label {
            font-weight: bold;
            color: #495057;
            margin-bottom: 5px;
        }

        .control-group input {
            padding: 8px 12px;
            border: 2px solid #dee2e6;
            border-radius: 5px;
            font-size: 16px;
            text-align: center;
        }

        .control-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .chat-section {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 30px;
            margin-bottom: 30px;
        }

        .chat-container {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            border: 2px solid #e9ecef;
        }

        .chat-messages {
            height: 400px;
            overflow-y: auto;
            margin-bottom: 15px;
            padding: 15px;
            background: white;
            border-radius: 10px;
            border: 1px solid #dee2e6;
        }

        .message {
            margin-bottom: 15px;
            padding: 12px;
            border-radius: 10px;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            margin-left: 50px;
        }

        .message.bot {
            background: #e9ecef;
            color: #333;
            margin-right: 50px;
        }

        .message.forgotten {
            opacity: 0.3;
            transform: scale(0.95);
            transition: all 0.5s ease;
        }

        .input-container {
            display: flex;
            gap: 10px;
        }

        .input-container input {
            flex: 1;
            padding: 12px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 16px;
        }

        .input-container input:focus {
            outline: none;
            border-color: #667eea;
        }

        .input-container button {
            padding: 12px 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }

        .input-container button:hover {
            transform: translateY(-2px);
        }

        .context-visualizer {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            border: 2px solid #e9ecef;
        }

        .context-visualizer h3 {
            margin-bottom: 15px;
            color: #333;
            text-align: center;
        }

        .context-bar {
            background: #e9ecef;
            height: 30px;
            border-radius: 15px;
            margin-bottom: 10px;
            position: relative;
            overflow: hidden;
        }

        .context-fill {
            background: linear-gradient(90deg, #28a745, #ffc107, #dc3545);
            height: 100%;
            border-radius: 15px;
            transition: width 0.3s ease;
            position: relative;
        }

        .context-percentage {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-weight: bold;
            font-size: 14px;
        }

        .context-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .context-stat {
            background: white;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #dee2e6;
        }

        .context-stat .label {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
        }

        .context-stat .value {
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }

        .memory-visualization {
            background: white;
            border-radius: 10px;
            padding: 15px;
            border: 1px solid #dee2e6;
        }

        .memory-slot {
            background: #f8f9fa;
            margin: 5px 0;
            padding: 8px;
            border-radius: 5px;
            border-left: 4px solid #28a745;
            font-size: 12px;
            transition: all 0.3s ease;
        }

        .memory-slot.fading {
            border-left-color: #ffc107;
            opacity: 0.7;
        }

        .memory-slot.forgotten {
            border-left-color: #dc3545;
            opacity: 0.3;
            text-decoration: line-through;
        }

        .reset-button {
            width: 100%;
            padding: 12px;
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
        }

        .reset-button:hover {
            background: #5a6268;
        }

        @media (max-width: 768px) {
            .chat-section {
                grid-template-columns: 1fr;
            }
            
            .controls {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Chatbot Kontext-Verlust Demo</h1>
            <p>Erleben Sie, wie ein Chatbot bei begrenzter Kontextkapazität ältere Informationen "vergisst"</p>
        </div>

        <div class="controls">
            <div class="control-group">
                <label for="maxContext">Max. Kontext (Zeichen)</label>
                <input type="number" id="maxContext" value="300" min="100" max="2000" step="50">
            </div>
            <div class="control-group">
                <label for="forgetThreshold">Vergessen bei (%)</label>
                <input type="number" id="forgetThreshold" value="80" min="50" max="100" step="5">
            </div>
            <div class="control-group">
                <label for="simulationSpeed">Simulation Speed</label>
                <input type="range" id="simulationSpeed" value="1000" min="500" max="3000" step="250">
            </div>
        </div>

        <div class="chat-section">
            <div class="chat-container">
                <div class="chat-messages" id="chatMessages"></div>
                <div class="input-container">
                    <input type="text" id="messageInput" placeholder="Schreiben Sie eine Nachricht..." maxlength="200">
                    <button onclick="sendMessage()">Senden</button>
                </div>
            </div>

            <div class="context-visualizer">
                <h3>📊 Kontext-Monitor</h3>
                
                <div class="context-bar">
                    <div class="context-fill" id="contextFill">
                        <div class="context-percentage" id="contextPercentage">0%</div>
                    </div>
                </div>

                <div class="context-info">
                    <div class="context-stat">
                        <div class="label">Aktuelle Größe</div>
                        <div class="value" id="currentSize">0</div>
                    </div>
                    <div class="context-stat">
                        <div class="label">Verfügbar</div>
                        <div class="value" id="availableSize">500</div>
                    </div>
                    <div class="context-stat">
                        <div class="label">Nachrichten</div>
                        <div class="value" id="messageCount">0</div>
                    </div>
                    <div class="context-stat">
                        <div class="label">Vergessen</div>
                        <div class="value" id="forgottenCount">0</div>
                    </div>
                </div>

                <div class="memory-visualization">
                    <h4 style="margin-bottom: 10px; text-align: center;">💭 Speicher-Status</h4>
                    <div id="memorySlots"></div>
                </div>

                <button class="reset-button" onclick="resetChat()">🔄 Chat zurücksetzen</button>
            </div>
        </div>
    </div>

    <script>
        class ChatbotContextDemo {
            constructor() {
                this.messages = [];
                this.maxContext = parseInt(document.getElementById('maxContext').value);
                this.forgetThreshold = parseInt(document.getElementById('forgetThreshold').value);
                this.currentContextSize = 0;
                this.forgottenCount = 0;
                
                this.setupEventListeners();
                this.updateDisplay();
            }

            setupEventListeners() {
                document.getElementById('messageInput').addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        this.sendMessage();
                    }
                });

                document.getElementById('maxContext').addEventListener('change', (e) => {
                    this.maxContext = parseInt(e.target.value);
                    this.updateDisplay();
                    this.checkContextOverflow();
                });

                document.getElementById('forgetThreshold').addEventListener('change', (e) => {
                    this.forgetThreshold = parseInt(e.target.value);
                });
            }

            sendMessage() {
                const input = document.getElementById('messageInput');
                const messageText = input.value.trim();
                
                if (!messageText) return;

                // User message hinzufügen
                this.addMessage('user', messageText);
                input.value = '';

                // Bot response nach kurzer Verzögerung
                setTimeout(() => {
                    const botResponse = this.generateBotResponse(messageText);
                    this.addMessage('bot', botResponse);
                }, parseInt(document.getElementById('simulationSpeed').value));
            }

            addMessage(sender, text) {
                const message = {
                    id: Date.now() + Math.random(),
                    sender: sender,
                    text: text,
                    timestamp: new Date(),
                    forgotten: false,
                    size: text.length + 50 // Zusätzlicher Overhead für Metadaten
                };

                this.messages.push(message);
                this.updateContextSize();
                this.renderMessages();
                this.checkContextOverflow();
                this.updateDisplay();
            }

            generateBotResponse(userMessage) {
                const responses = [
                    `Ich verstehe, Sie haben "${userMessage}" gesagt. Wie kann ich Ihnen weiterhelfen?`,
                    `Das ist interessant! Bezüglich "${userMessage}" kann ich sagen, dass...`,
                    `Vielen Dank für Ihre Nachricht über "${userMessage}". Hier ist meine Antwort:`,
                    `Ich erinnere mich an unsere bisherige Unterhaltung und zu "${userMessage}" möchte ich ergänzen...`,
                    `Basierend auf unserem Gespräch und Ihrer Frage zu "${userMessage}" schlage ich vor...`
                ];

                const baseResponse = responses[Math.floor(Math.random() * responses.length)];
                const additionalContext = this.getMemoryContext();
                
                return baseResponse + (additionalContext ? ` ${additionalContext}` : '');
            }

            getMemoryContext() {
                const recentMessages = this.messages
                    .filter(m => !m.forgotten)
                    .slice(-3)
                    .filter(m => m.sender === 'user')
                    .map(m => m.text);

                if (recentMessages.length > 1) {
                    return `Ich erinnere mich noch an: ${recentMessages.slice(0, -1).join(', ')}.`;
                }
                return '';
            }

            updateContextSize() {
                this.currentContextSize = this.messages
                    .filter(m => !m.forgotten)
                    .reduce((sum, message) => sum + message.size, 0);
            }

            checkContextOverflow() {
                const threshold = (this.maxContext * this.forgetThreshold) / 100;
                
                while (this.currentContextSize > threshold && this.messages.some(m => !m.forgotten)) {
                    // Älteste nicht-vergessene Nachricht finden und als vergessen markieren
                    const oldestMessage = this.messages.find(m => !m.forgotten);
                    if (oldestMessage) {
                        oldestMessage.forgotten = true;
                        this.forgottenCount++;
                        this.updateContextSize();
                        
                        // Visuell als vergessen markieren
                        setTimeout(() => {
                            this.renderMessages();
                        }, 500);
                    }
                }
            }

            renderMessages() {
                const chatMessages = document.getElementById('chatMessages');
                chatMessages.innerHTML = '';

                this.messages.forEach((message, index) => {
                    const messageDiv = document.createElement('div');
                    messageDiv.className = `message ${message.sender}`;
                    messageDiv.textContent = message.text;
                    
                    if (message.forgotten) {
                        messageDiv.classList.add('forgotten');
                    }

                    chatMessages.appendChild(messageDiv);
                });

                // Auto-scroll nach unten
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            renderMemorySlots() {
                const memorySlots = document.getElementById('memorySlots');
                memorySlots.innerHTML = '';

                this.messages.slice(-8).forEach((message, index) => {
                    const slot = document.createElement('div');
                    slot.className = 'memory-slot';
                    
                    if (message.forgotten) {
                        slot.classList.add('forgotten');
                    } else if (this.currentContextSize > (this.maxContext * 0.7)) {
                        slot.classList.add('fading');
                    }

                    const preview = message.text.length > 30 ? 
                        message.text.substring(0, 30) + '...' : 
                        message.text;
                    
                    slot.textContent = `${message.sender.toUpperCase()}: ${preview}`;
                    memorySlots.appendChild(slot);
                });
            }

            updateDisplay() {
                const percentage = Math.min(100, (this.currentContextSize / this.maxContext) * 100);
                
                document.getElementById('contextFill').style.width = `${percentage}%`;
                document.getElementById('contextPercentage').textContent = `${Math.round(percentage)}%`;
                document.getElementById('currentSize').textContent = this.currentContextSize;
                document.getElementById('availableSize').textContent = this.maxContext - this.currentContextSize;
                document.getElementById('messageCount').textContent = this.messages.length;
                document.getElementById('forgottenCount').textContent = this.forgottenCount;

                this.renderMemorySlots();
            }

            resetChat() {
                this.messages = [];
                this.currentContextSize = 0;
                this.forgottenCount = 0;
                this.renderMessages();
                this.updateDisplay();
                
                // Willkommensnachricht
                setTimeout(() => {
                    this.addMessage('bot', 'Hallo! Ich bin ein Chatbot mit begrenztem Kontext. Beginnen Sie eine Unterhaltung und beobachten Sie, wie ich ältere Nachrichten vergesse, wenn mein Speicher voll wird.');
                }, 500);
            }
        }

        // App initialisieren
        let chatDemo;

        window.onload = function() {
            chatDemo = new ChatbotContextDemo();
            
            // Willkommensnachricht
            setTimeout(() => {
                chatDemo.addMessage('bot', 'Willkommen! Ich bin ein Chatbot mit begrenztem Kontext. Senden Sie mir Nachrichten und beobachten Sie, wie ich bei Erreichen der Kapazitätsgrenze ältere Informationen vergesse.');
            }, 1000);
        };

        // Globale Funktionen für HTML-Event-Handler
        function sendMessage() {
            chatDemo.sendMessage();
        }

        function resetChat() {
            chatDemo.resetChat();
        }
    </script>
</body>
</html>
